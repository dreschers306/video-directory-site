backend:
  name: github
  repo: dreschers306/video-directory-site # Example: dreschers306/video-directory-site
  branch: main # Or master, depending on your default branch
  auth_type: implicit
  app_id: Ov23lie0MLXsIP0cdDnb # <-- PASTE YOUR CLIENT ID HERE 
  cms_label_prefix: content/ # Optional: Prefix for commit messages

media_folder: "src/assets/images" # Where uploaded media files will be stored - WE MIGHT NOT NEED THIS YET
public_folder: "/assets/images" # Public path for media files - WE MIGHT NOT NEED THIS YET

collections:
  - name: "videos" # Used in routes, e.g., /admin/#/collections/videos
    label: "Videos" # Used in the UI
    label_singular: "Video" # Used in the UI, e.g., "New Video"
    folder: "_dummy_folder_not_used" # Required by Decap, but we use file collection
    file: "src/_data/videos.json" # Specify the single JSON file to edit
    format: "json" # Specify the file format
    identifier_field: "videoId" # Field to identify entries in the UI
    create: true # Allow creating new entries
    delete: true # Allow deleting entries
    slug: "{{videoId}}" # Not super relevant for file collections, but good practice
    fields: # Define the fields for each video object
      - { label: "Video ID (Code)", name: "videoId", widget: "string" }
      - { label: "Bunny Video URL", name: "bunnyVideoUrl", widget: "string" }
      - { label: "Bunny Thumbnail URL", name: "bunnyThumbnailUrl", widget: "string" }
      - { label: "Bunny Preview Video URL", name: "bunnyPreviewVideoUrl", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" } } # Basic list widget for tags
      - { label: "Source Group ID", name: "sourceGroupId", widget: "string", required: false } # Optional field
      - { label: "Source URL", name: "sourceUrl", widget: "string", required: false }
      - { label: "Affiliate Link", name: "affiliateLink", widget: "string", required: false }
      - { label: "Date Added", name: "dateAdded", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: false } # Date widget