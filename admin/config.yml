backend:
  name: github
  repo: dreschers306/video-directory-site # Your GitHub username/repo name
  branch: main # Your default branch
  # Correct indentation for implicit flow settings:
  auth_type: implicit
  app_id: Ov23lie0MLXsIP0cdDnb # Your GitHub OAuth App Client ID
  cms_label_prefix: content/ # Optional: Prefix for commit messages

# We might not need media/public folders if Python script handles all uploads,
# but defining them doesn't hurt for now.
media_folder: "src/assets/images" 
public_folder: "/assets/images" 

collections:
  - name: "videos" # Identifier for this collection
    label: "Videos" # Display name in the UI
    label_singular: "Video" # Display name for one item
    # Use 'file' for single file collections, remove 'folder'
    file: "src/_data/videos.json" # Path to the JSON file relative to root
    format: "json" # Data format
    # Specify that the top-level structure is a list/array
    # and define fields for objects within that list.
    # This tells Decap how to handle the array in videos.json.
    structure: list # Or "object" if the root wasn't an array
    fields: # Define the fields for each video object in the JSON array
      - { label: "Video ID (Code)", name: "videoId", widget: "string" }
      - { label: "Bunny Video URL", name: "bunnyVideoUrl", widget: "string" }
      - { label: "Bunny Thumbnail URL", name: "bunnyThumbnailUrl", widget: "string" }
      - { label: "Bunny Preview Video URL", name: "bunnyPreviewVideoUrl", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" } } 
      - { label: "Source Group ID", name: "sourceGroupId", widget: "string", required: false } 
      - { label: "Source URL", name: "sourceUrl", widget: "string", required: false }
      - { label: "Affiliate Link", name: "affiliateLink", widget: "string", required: false }
      - { label: "Date Added", name: "dateAdded", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: false } 
    # Removed identifier_field and slug - less relevant for 'file' collections
    # Removed create/delete - implicitly true for file collections when fields are defined