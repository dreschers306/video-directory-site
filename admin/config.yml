backend:
  name: github
  repo: dreschers306/video-directory-site # Your repo
  branch: main # Your branch
  base_url: https://video-directory-site.pages.dev/ # <-- Set to YOUR site's primary URL
  auth_endpoint: api/auth # <-- Points to functions/api/auth.js

# --- The rest of the file (media_folder, collections) remains unchanged ---

media_folder: "src/assets/images" 
public_folder: "/assets/images" 

collections:
  - name: "videos"             # Internal identifier
    label: "Videos"           # UI Label
    folder: "src/_content/videos" # Path to folder where video files are stored
    create: true              # Allow creating new files via CMS
    slug: "{{videoId}}"       # Sets filename using the videoId field value
    extension: "md"           # File extension for new files
    format: "frontmatter" # Data format (YAML --- front matter ---)
    fields:                   # Fields defined directly for each file's front matter
      - { label: "Video ID (Code)", name: "videoId", widget: "string" }
      # Note: dateAdded usually best set automatically, but can be manual:
      - { label: "Date Added", name: "dateAdded", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: false } 
      - { label: "Bunny Video URL", name: "bunnyVideoUrl", widget: "string" }
      - { label: "Bunny Thumbnail URL", name: "bunnyThumbnailUrl", widget: "string" }
      - { label: "Bunny Preview Video URL", name: "bunnyPreviewVideoUrl", widget: "string" }
      - { label: "Tags (comma-separated)", name: "tags", widget: "string", required: false } 
      - { label: "Source Group ID", name: "sourceGroupId", widget: "string", required: false } 
      - { label: "Source URL", name: "sourceUrl", widget: "string", required: false }
      - { label: "Affiliate Link", name: "affiliateLink", widget: "string", required: false }
      # Optional field to edit content below front matter:
      # - { label: "Body", name: "body", widget: "markdown", required: false } 